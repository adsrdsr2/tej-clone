# Deploy the static Astro build to GitHub Pages.
#
# Triggers on every push to the default branch (main) and can also be run
# manually. The Astro config reads GITHUB_REPOSITORY / GITHUB_ACTIONS from
# the runner environment to set the correct `base` and `site` for the
# Pages sub-path (https://<owner>.github.io/<repo>/).
#
# One-time setup (already done for adsrdsr2/tej-clone, kept here for forks):
#   gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow
# or: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
